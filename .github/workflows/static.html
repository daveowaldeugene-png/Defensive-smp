<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Defensive SMP</title>
    <style>
        /* Full-page background and centering */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url("https://static.planetminecraft.com/files/image/minecraft/project/2020/842/13001111-future-wallpaper_l.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Welcome message styling */
        .welcome-message {
            text-align: center;
            margin-bottom: 30px;
        }

        .welcome-message h1 {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
        }

        .welcome-message h2 {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 3px black;
        }

        /* Join button styling */
        .join-button {
            background-color: rgba(128, 128, 128, 0.8);
            color: white;
            padding: 15px 25px;
            text-align: center;
            font-size: 16px;
            margin: 10px auto;
            border-radius: 12px;
            width: fit-content;
            box-shadow: 2px 2px 8px black;
            cursor: pointer;
        }

        /* Optional: clickable IP hover effect */
        .join-button:hover {
            background-color: rgba(200, 200, 200, 0.9);
            color: black;
        }
    </style>
</head>
<body>
    
    <div class="welcome-message">
        <h1>Defensive SMP</h1>
        <h2>Join using the IP Below</h2>
    </div>

    <div class="join-button">
        <h3>IP: defensivesmp.minekeep.gg</h3>
        <h3>Bedrock IP: defensivesmp.minekeep.gg:19132</h3>
    </div>

</body>
</html>
